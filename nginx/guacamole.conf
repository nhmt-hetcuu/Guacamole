# ----------------------------------------------------
# Nginx đứng trước Guacamole — dán nguyên file vào Nginx UI (Advanced Mode)
# https://adremote.hetcuu.com → Cloudflare (SSL: Flexible) → Nginx :80 → Guacamole 10.0.0.200:8005
#
# Chỉ có 1 khối server, không upstream / map ở mức http
# để chạy chung với các site khác mà không bị trùng
# ----------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name adremote.hetcuu.com;

    # Lấy IP thật của người dùng từ header Cloudflare
    # (cần cho lịch sử đăng nhập và tính năng tự khóa IP đăng nhập sai)
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;
    # Mạng Docker (nếu cloudflared trong Docker trỏ vào Nginx)
    set_real_ip_from  172.16.0.0/12;
    # Dải IP Cloudflare — cập nhật tại https://www.cloudflare.com/ips/
    set_real_ip_from  173.245.48.0/20;
    set_real_ip_from  103.21.244.0/22;
    set_real_ip_from  103.22.200.0/22;
    set_real_ip_from  103.31.4.0/22;
    set_real_ip_from  141.101.64.0/18;
    set_real_ip_from  108.162.192.0/18;
    set_real_ip_from  190.93.240.0/20;
    set_real_ip_from  188.114.96.0/20;
    set_real_ip_from  197.234.240.0/22;
    set_real_ip_from  198.41.128.0/17;
    set_real_ip_from  162.158.0.0/15;
    set_real_ip_from  104.16.0.0/13;
    set_real_ip_from  104.24.0.0/14;
    set_real_ip_from  172.64.0.0/13;
    set_real_ip_from  131.0.72.0/22;
    set_real_ip_from  2400:cb00::/32;
    set_real_ip_from  2606:4700::/32;
    set_real_ip_from  2803:f800::/32;
    set_real_ip_from  2405:b500::/32;
    set_real_ip_from  2405:8100::/32;
    set_real_ip_from  2a06:98c0::/29;
    set_real_ip_from  2c0f:f248::/32;

    # Cho phép upload file lớn qua thanh bên Guacamole (Ctrl+Alt+Shift)
    client_max_body_size 2g;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Cloudflare gửi sẵn https; truy cập thẳng không qua Cloudflare thì bỏ trống
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    # WebSocket theo hướng dẫn chính thức của Guacamole
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $http_connection;

    # Màn hình remote phải đẩy ngay, không gom bộ đệm
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_cache             off;

    # Phiên remote dài không bị cắt
    proxy_connect_timeout 10s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;

    location / {
        # Máy chạy Docker Guacamole (GUAC_PORT trong .env)
        proxy_pass http://10.0.0.200:8005;
    }

    # Đường tunnel sinh rất nhiều request — tắt log cho đỡ đầy ổ
    location ~ ^/(websocket-tunnel|tunnel) {
        proxy_pass http://10.0.0.200:8005;
        access_log off;
    }
}
